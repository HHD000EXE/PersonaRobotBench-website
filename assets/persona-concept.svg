<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="concept-title concept-desc">
<title id="concept-title">Same goal. Different right ways.</title><desc id="concept-desc">PersonaRobotBench starts from task-specific user preferences. Task68 uses one request, initial scene, robot and policy. Persona A requires carrying a container clear of the table; Persona B requires a table-supported slide. Both motions have the same start and target, but only the matching behavior satisfies each persona. The drawing is a conceptual illustration, not a measured policy rollout.</desc>
