<symbol id="v2d-icon-body" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="2.5"/><path d="M12 7v7M4 10l8-2 8 2M12 14l-6 8M12 14l6 8"/></g></symbol>
<symbol id="v2d-icon-robot" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16M8 22v-5l-3-5 4-6M10 6l7 4M17 13v5M14 18h6M14 18l-2 3M20 18l2 3"/><circle cx="9" cy="4" r="2"/><circle cx="18" cy="11" r="2.5"/><circle cx="6" cy="13" r="2"/></g></symbol>
