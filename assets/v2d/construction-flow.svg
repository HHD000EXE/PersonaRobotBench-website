<symbol id="v2d-icon-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6Z m-5 9 3 3 7-7"/></g></symbol>
<symbol id="v2d-icon-assets" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M5 12v9M19 12v9M8 7h8M9 7v5M15 7v5"/><rect x="9" y="2" width="6" height="5" rx="1"/></g></symbol>
