<svg xmlns="http://www.w3.org/2000/svg" class="v2d-architecture" viewBox="0 0 1240 770" role="img" aria-labelledby="v2d-architecture-title v2d-architecture-desc">
<title id="v2d-architecture-title">Video-to-Data: three inputs, one construction path, separate persona conditioning</title>
<desc id="v2d-architecture-desc">RGB video, released human-object 3D and skeleton inputs merge into robot retargeting. Robot motion and scene assets enter Isaac assembly. Replay checks either accept the constructed replay or send failures to repair; the dashed return updates the affected construction components. A separate bottom lane carries user evidence to a representation, a conditioned policy and robot actions. Reference motion is reserved for evaluation.</desc>
<defs>
<marker id="v2d-arrow-flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="m1 1 6 3-6 3" fill="none" stroke="#416858" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="v2d-arrow-repair" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="m1 1 6 3-6 3" fill="none" stroke="#b65a32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="v2d-arrow-persona" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="m1 1 6 3-6 3" fill="none" stroke="#416a92" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<symbol id="v2d-icon-video" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 6 3-6 3Z"/></g></symbol>
