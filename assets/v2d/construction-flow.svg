<text x="670" y="479" fill="#627168" font-size="10.5" font-weight="400" >Released / reconstructed / authored</text>
<rect x="966" y="370" width="250" height="120" rx="14" fill="#fcf0e9" stroke="#edd4c6" />
<use href="#v2d-icon-repair" x="984" y="388" width="28" height="28" color="#a9502f" aria-hidden="true"/>
<text x="1024" y="407" fill="#763d28" font-size="16" font-weight="650" >Repair components</text>
<text x="984" y="438" fill="#627168" font-size="11.5" font-weight="400" >Motion · alignment · assets · control</text>
<text x="984" y="461" fill="#627168" font-size="11.5" font-weight="400" >Version the change; rerun checks.</text>
<rect x="966" y="100" width="250" height="64" rx="12" fill="#eaf2ec" stroke="#ccddd0" />
