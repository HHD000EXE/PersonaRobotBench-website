<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1400" viewBox="0 0 600 1400" role="img" aria-labelledby="concept-title concept-desc">
<title id="concept-title">Know the user. Personalize the action.</title><desc id="concept-desc">Two users provide user profiles, not target desk arrangements. User A uses a mouse with the left hand and writes with the right; User B uses a mouse with the right hand and writes with the left. Given the shared request, Set up my desk for work, a personal robot agent infers task-relevant preferences. One shared policy and G1 robot create different top-down layouts: mouse left and notebook right for A, the reverse for B. Held-out task-specific user preferences go only to the evaluator, which compares predictions and executed layouts with actual preferences. The figure is a conceptual desk-layout illustration, not a measured rollout or a full Task1 success claim.</desc>
